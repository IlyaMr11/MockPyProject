[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "opsmonitor-benchmark"
version = "0.1.0"
description = "Compact backend benchmark repository for AI pull request review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opsmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

